name: Deploy to GitHub Pages

# Publishes the built app to the gh-pages branch, which GitHub serves at
# https://<owner>.github.io/bluesharpapp/.
#
# This deliberately does not use actions/deploy-pages. That path needs the
# repository's Pages source set to "GitHub Actions", and the workflow token is
# not allowed to set it. Pushing a gh-pages branch enables Pages on its own and
# needs no repository settings at all.
on:
  push:
    branches:
      - main
      - claude/piano-violin-accompaniment-app-bn1eft
  workflow_dispatch:

permissions:
  contents: write

# Two branches can publish here, so let a running deploy finish first: the
# last push to land is the one that ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: false # warnings should not fail the build

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # .nojekyll stops GitHub skipping files whose names start with _.
          touch build/.nojekyll

          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/gh-pages

          # Replace the published files, keeping the branch's history.
          find /tmp/gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r build/. /tmp/gh-pages/

          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Build output is unchanged; nothing to publish."
          else
            git commit -m "Deploy ${GITHUB_SHA:0:7} from ${GITHUB_REF_NAME}"
            git push origin gh-pages
          fi
